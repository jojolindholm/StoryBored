version: '3.8'

services:
  # Main Excalidraw App (StoryBored)
  storybored-app:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: storybored-app
    ports:
      - "3200:3200"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    networks:
      - storybored-network

  # Collaboration Server
  storybored-collab:
    build:
      context: .
      dockerfile: Dockerfile.collab
    container_name: storybored-collab
    ports:
      - "3002:3002"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3002
      - CORS_ORIGIN=https://storybored.johanlindholm.com,https://johanlindholm.com
      - COLLAB_DATA_DIR=/app/collab-data
      - MAX_JSON_PAYLOAD=100mb
    volumes:
      # Persist collaboration data
      - collab-data:/app/collab-data
    networks:
      - storybored-network
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

networks:
  storybored-network:
    driver: bridge

volumes:
  collab-data:
    driver: local
